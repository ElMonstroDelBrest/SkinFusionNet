name: skinfusionnet
description: "SkinFusionNet: A multimodal Mobile Framework for Skin Lesion Classification Using ABCD Features and Deep Learning"
publish_to: 'none'
version: 0.2.0+2

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  crypto: ^3.0.7          # runtime verification of bundled ONNX SHA-256 hashes
  onnxruntime: ^1.4.1     # ONNX Runtime bindings (Android/iOS)
  image: ^4.3.0           # pure-Dart decode / resize / pixel access
  image_picker: ^1.1.2    # camera + gallery capture
  image_cropper: ^8.1.0   # native square-crop UI before inference
  opencv_core: ^1.3.0     # DullRazor (inpaint), morphology, Lab, contours
  sqflite: ^2.3.3         # local append-only audit / training database
  path: ^1.9.0            # db path resolution
  path_provider: ^2.1.4   # app documents directory

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/unet.onnx
    - assets/models/cnn_lesion_feats.onnx
    - assets/models/cnn_dehair_feats.onnx
    - assets/models/lgbm_a.onnx
    - assets/models/lgbm_c.onnx
    - assets/models/model_manifest.json
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
