[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "derm"
version = "0.1.0"
authors = [{name = "George-Daniel Gherasim"}]
description = "SkinFusionNet: A multimodal Mobile Framework for Skin Lesion Classification Using ABCD Features and Deep Learning"
requires-python = ">=3.11"

# Dependencies are grouped by task under requirements/: training, analysis and export.

[tool.setuptools.packages.find]
include = ["derm*"]
